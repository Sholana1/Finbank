syntax = "proto3";

package identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sholana1/fintechdemo/gen/identity/v1;identityv1";

service IdentityService {
    rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
    rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message RegisterUserRequest {
    string email = 1;
    string phone_number = 2;
    string password = 3;
}

message RegisterUserResponse {
    string user_id = 1;
    UserStatus status = 2;
}

enum UserStatus {
    USER_STATUS_UNSPECIFIED = 0;
    USER_STATUS_PENDING_VERIFICATION = 1;
    USER_STATUS_ACTIVE = 2;
    USER_STATUS_SUSPENDED = 3;
    USER_STATUS_CLOSED = 4;
}

message LoginRequest {
    // identifier is the user's email address or phone number.
    string identifier = 1;
    string password = 2;
    string device_id = 3;
    string ip_address = 4;
    string user_agent = 5;
}

message LoginResponse {
    SessionTokens tokens = 1;
}

message RefreshSessionRequest {
    string refresh_token = 1;
}

message RefreshSessionResponse {
    SessionTokens tokens = 1;
}

message LogoutRequest {
    string session_id = 1;
    string user_id = 2;
}

message LogoutResponse {}

message SessionTokens {
    string access_token = 1;
    google.protobuf.Timestamp access_token_expires_at = 2;
    string refresh_token = 3;
    google.protobuf.Timestamp refresh_token_expires_at = 4;
    string session_id = 5;
    string user_id = 6;
}
